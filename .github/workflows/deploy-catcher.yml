name: yyc-transit-catcher-deploy CD

on:
    push:
        branches: [ "main" ]
        paths: [ "catcher/**", "config.py", "pyproject.toml", "uv.lock", ".github/workflows/deploy-catcher.yml" ]
    workflow_dispatch:

concurrency:
    group: deploy-catcher
    cancel-in-progress: false

permissions:
    id-token: write # OIDC token for assuming the AWS role
    contents: read

env:
    AWS_REGION: ca-central-1
    ECR_REPOSITORY: yyc-transit/catcher
    TASK_DEFINITION: catcher/task-definition.json
    CONTAINER_NAME: catcher
    CLUSTER: yyc-transit
    SERVICE: yyc-transit-catcher

jobs:
    deploy:
        # Native ARM runner, so the image matches the task's ARM64 runtime platform without QEMU.
        runs-on: ubuntu-24.04-arm
        # Room for a circuit-breaker rollback (three failed starts) plus the wait.
        timeout-minutes: 30

        steps:
        - uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::860574615377:role/yyc-transit-github-deploy
            aws-region: ${{ env.AWS_REGION }}

        - name: Log in to Amazon ECR
          id: ecr
          uses: aws-actions/amazon-ecr-login@v2

        # Tags are immutable in ECR, so a re-run for a commit whose image was
        # already pushed skips the build instead of failing on the push.
        - name: Check for an existing image
          id: image
          env:
            REGISTRY: ${{ steps.ecr.outputs.registry }}
          run: |
            TAG="${GITHUB_SHA::7}"
            echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"
            if out=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" 2>&1); then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Image $TAG already in ECR, skipping the build"
            elif grep -q ImageNotFoundException <<< "$out"; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "$out"
              exit 1
            fi

        - name: Build and push image
          if: steps.image.outputs.exists == 'false'
          env:
            IMAGE: ${{ steps.image.outputs.image }}
          run: |
            docker build --platform linux/arm64 -f catcher/Dockerfile -t "$IMAGE" .
            docker push "$IMAGE"

        - name: Render task definition with new image
          id: render
          uses: aws-actions/amazon-ecs-render-task-definition@v1
          with:
            task-definition: ${{ env.TASK_DEFINITION }}
            container-name: ${{ env.CONTAINER_NAME }}
            image: ${{ steps.image.outputs.image }}

        # Registers the revision and updates the service. ECS starts the new task
        # before stopping the old one (min 100%, max 200%), so no cycles are lost.
        # If the new task keeps failing to start, the circuit breaker rolls the
        # service back to the previous revision.
        - name: Deploy to the ECS service
          id: deploy
          uses: aws-actions/amazon-ecs-deploy-task-definition@v2
          with:
            task-definition: ${{ steps.render.outputs.task-definition }}
            cluster: ${{ env.CLUSTER }}
            service: ${{ env.SERVICE }}
            wait-for-service-stability: true
            wait-for-minutes: 20

        # A rollback also ends in a stable service (on the old revision), so the
        # wait above can pass even when the deploy failed. Check what is running.
        - name: Verify the service runs the new revision
          env:
            TASK_DEF_ARN: ${{ steps.deploy.outputs.task-definition-arn }}
          run: |
            read -r running rollout <<< "$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].[taskDefinition, deployments[?status==`PRIMARY`].rolloutState | [0]]' --output text)"
            if [ "$running" != "$TASK_DEF_ARN" ]; then
              echo "::error::Service runs $running, expected $TASK_DEF_ARN. The deployment was rolled back"
              exit 1
            fi
            if [ "$rollout" != "COMPLETED" ]; then
              echo "::error::Deployment rollout state is $rollout, expected COMPLETED"
              exit 1
            fi
            echo "Service $SERVICE now runs $TASK_DEF_ARN"
